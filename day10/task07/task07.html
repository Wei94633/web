
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task07 - Mini Chat</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

    <h1>Task07 - Mini Chat</h1>

    <div id="chatBox" class="border rounded p-3 mb-3"
         style="height: 300px; overflow-y: auto;">
    </div>

    <form id="chatForm">

        <div class="mb-3">
            <label for="name" class="form-label">Name:</label>
            <input type="text" id="name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="message" class="form-label">Message:</label>
            <input type="text" id="message" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary">Send</button>

    </form>

    <p id="errorMessage" class="text-danger mt-3"></p>

    <script src="task07.js"></script>

</body>
</html>
