
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task05</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

    <h1>Task05 - Product Search</h1>

    <form id="searchForm">

        <div class="mb-3">
            <label for="type" class="form-label">Type:</label>
            <input type="text" id="type" class="form-control">
        </div>

        <div class="mb-3">
            <label for="brand" class="form-label">Brand:</label>
            <input type="text" id="brand" class="form-control">
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">Price:</label>
            <input type="text" id="price" class="form-control" placeholder="e.g. >100">
        </div>

        <div class="mb-3">
            <label for="number" class="form-label">Number:</label>
            <input type="number" id="number" class="form-control" min="1">
        </div>

        <button type="submit" class="btn btn-primary">Search</button>

    </form>

    <p id="errorMessage" class="text-danger mt-3"></p>

    <table class="table table-bordered mt-4">
        <thead>
            <tr>
                <th>Type</th>
                <th>Brand</th>
                <th>Price</th>
                <th>Number</th>
                <th>Stock</th>
            </tr>
        </thead>

        <tbody id="productTable">
        </tbody>
    </table>

    <script src="task05.js"></script>

</body>
</html>
